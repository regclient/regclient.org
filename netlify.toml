[build.environment]
HUGO_VERSION = "0.168.0"
NODE_VERSION = "26"
TZ = "America/Los_Angeles"

[build]
publish = "public"
command = "make all"

[context.deploy-preview]
command = "make preview-build"

[context.branch-deploy]
command = "make preview-build"

[[redirects]]
  from = "/cli/regctl/index/"
  to = "/cli/regctl/index/index.html"
  force = true
